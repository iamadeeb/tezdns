<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TEZ DNS - A simple, fast and reliable DNS app.">
  <title>TEZ DNS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(145deg, #08c79a 0%, #18b8c7 45%, #588bea 100%);
      color: #ffffff;
      text-align: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 26px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    h1 .tez {
      color: #ffffff;
    }

    h1 .dns {
      color: #baff7a;
    }

    .description {
      max-width: 480px;
      margin: 18px 0 0;
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
    }

    .features {
      margin-top: 30px;
      padding: 11px 20px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 22px;
      }

      .logo {
        width: 88px;
        height: 88px;
        border-radius: 21px;
      }

      h1 {
        font-size: 2.35rem;
      }

      .description {
        max-width: 340px;
        font-size: 1rem;
        line-height: 1.6;
      }

      .features {
        margin-top: 25px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <img src="logo.png" alt="TEZ DNS Logo" class="logo">

    <h1>
      <span class="tez">TEZ</span><span class="dns">DNS</span>
    </h1>

    <p class="description">
      A simple and fast DNS app that lets you switch between trusted
      DNS providers in seconds. Choose your preferred DNS and connect
      with a clean and easy-to-use experience.
    </p>

    <div class="features">
      Fast &nbsp;•&nbsp; Simple &nbsp;•&nbsp; Reliable
    </div>
  </main>

  <footer>
    © 2026 TEZ DNS. All rights reserved.
  </footer>

</body>
</html>
